name: Keychain
description: Keychain is an AI-powered operating system and manufacturing network for
  the consumer packaged goods (CPG) industry. The platform connects brands, retailers,
  and private-label buyers with vetted contract manufacturers and co-manufacturers,
  helping teams discover production partners, source ingredients and packaging, benchmark
  supplier capabilities, and bring new products to market faster. Keychain aggregates
  data across the fragmented CPG supply chain into a searchable network so brands can
  find who makes what and manufacturers can surface available capacity. The company
  is headquartered in New York and is backed by Lightspeed Venture Partners.
